name: Publish Nuget Packages

permissions:
  id-token: write
  contents: write
  packages: write

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'main'

concurrency:
  # One run of this pipeline per branch at a time; a newer commit cancels the older in-flight run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Inlined from baoduy/ShareWorkflows .github/workflows/dotnet-nuget-release.yml
# NuGet Trusted Publishing (OIDC) requires the token to be minted in this
# workflow directly; it cannot be referenced via a reusable workflow.
env:
  Project_Path: 'src/DKNet.FW.sln'
  Enable_Release: 'false'
  Enable_Nuget_Release: ${{ github.ref == 'refs/heads/main' }}
  Dotnet_Version: 10.x

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      # Consumed by publish-npm so the dknet-skills package carries the same version as the NuGet packages.
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
        #https://github.com/actions/setup-dotnet

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: ${{ env.Dotnet_Version }}
          #global-json-file: global.json

      # Build
      - name: Ensure GitHub NuGet Source
        run: |
          dotnet nuget add source 'https://nuget.pkg.github.com/baoduy/index.json' \
          -n github -u baoduy -p ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore ${{ env.Project_Path }}
      - name: Build
        run: dotnet build ${{ env.Project_Path }} --no-restore --configuration Release

      # No tests on the release pipeline — unit tests run on `dev` (build-test-coverage.yml).

      # Versioning
      - name: Calculate version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          # Major is never bumped by this pipeline. It is the repository owner's
          # decision, taken by hand: tag `main` with `v<N>.0.0`, then re-run this
          # workflow. This sentinel matches no commit, so `!:`, `BREAKING CHANGE:`
          # and the retired `(MAJOR)` marker all bump nothing.
          major_pattern: "DKNET_MAJOR_IS_TAGGED_BY_HAND_NEVER_BY_CI"
          # minor_pattern is deliberately absent — the action's own default is
          # /feat(\(.+\))?:/, which is the Conventional Commit style already used
          # on dev. Do not re-add an override.
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: false

      - name: Set NEXT_VERSION
        run: echo "NEXT_VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV

      - name: Print the version
        run: echo ${{ steps.version.outputs.version }}

      # Ensure the project able to Package
      - name: Package
        run: dotnet pack ${{ env.Project_Path }} --no-build --no-restore --configuration Release --output ${{ runner.WORKSPACE }}/nupkgs -p:PackageVersion=${{ env.NEXT_VERSION }}
      - name: List Package
        run: ls ${{ runner.WORKSPACE }}/nupkgs

      - name: Zip Release
        if: ${{ env.Enable_Release == 'true' || env.Enable_Nuget_Release == 'true'}}
        uses: thedoctor0/zip-release@0.7.6
        with:
          # Filename for archive
          filename: release.zip
          directory: ${{ runner.WORKSPACE }}/nupkgs

      # Push nuget packages to Github Repository
      - name: Publish
        if: ${{ env.Enable_Release == 'true' }}
        continue-on-error: true
        run: dotnet nuget push ${{ runner.WORKSPACE }}/nupkgs/*.nupkg --skip-duplicate --source github --api-key ${{ secrets.PACKAGE_TOKEN }}

      # Create Release
      - name: Release
        uses: softprops/action-gh-release@v3.0.1
        if: ${{ env.Enable_Release == 'true' || env.Enable_Nuget_Release == 'true' }}
        continue-on-error: true
        with:
          generate_release_notes: true
          make_latest: true
          files: ${{ runner.WORKSPACE }}/nupkgs/release.zip
          tag_name: v${{ env.NEXT_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Publish to NUGET.ORG via Trusted Publishing (OIDC)
      # See: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet login (Trusted Publishing)
        id: login
        if: ${{ env.Enable_Nuget_Release == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Nuget
        if: ${{ env.Enable_Nuget_Release == 'true' }}
        continue-on-error: true
        run: dotnet nuget push ${{ runner.WORKSPACE }}/nupkgs/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

  # The dknet-skills agent-skills plugin (plugins/dknet-skills) goes to npmjs.com as @drunkcoding/dknet-skills
  # AFTER the NuGet packages, stamped with the SAME version number. No tag and no GitHub release of its own —
  # the v<version> release above already marks the commit. The repo keeps the placeholder 0.0.0 in
  # plugins/dknet-skills/package.json and .claude-plugin/plugin.json; the version is injected here, exactly
  # like -p:PackageVersion for the NuGet packages.
  #
  # Branches:
  #   main — release version (e.g. 9.5.10), npm dist-tag "latest". Runs after the NuGet publish above.
  #   dev  — test channel: `gh workflow run dotnet-publish.yml --ref dev`. The build job still runs (it computes
  #          the version and packs) but Enable_Nuget_Release/Enable_Release are false there, so nothing goes to
  #          NuGet and no GitHub release is created; this job publishes <version>-dev.<run_number> under the npm
  #          dist-tag "dev" (install with `npm i -D @drunkcoding/dknet-skills@dev`), so it can never take a
  #          version number a main release will need.
  # Auth: npm Trusted Publishing (OIDC) — https://docs.npmjs.com/trusted-publishers. No NPM_TOKEN secret and
  # nothing to rotate; the job mints a short-lived credential from the `id-token: write` permission below.
  # One-time setup on npmjs.com → package @drunkcoding/dknet-skills → Settings → Trusted Publisher →
  # GitHub Actions, owner/repo `baoduy/DKNet`, workflow filename `dotnet-publish.yml` (exact, case-sensitive,
  # with the extension), environment left blank. Afterwards set publishing access to "Require two-factor
  # authentication and disallow tokens" — that blocks token publishes without affecting OIDC.
  # npm generates the provenance attestation automatically here, so no --provenance flag.
  publish-npm:
    name: Publish dknet-skills (npm)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + automatic provenance
    env:
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' }}
      VERSION: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.version || format('{0}-dev.{1}', needs.build.outputs.version, github.run_number) }}
      NPM_DIST_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
    defaults:
      run:
        working-directory: plugins/dknet-skills

    steps:
      - uses: actions/checkout@v7.0.0

      # Trusted publishing needs npm >= 11.5.1 / node >= 22.14; node 24 ships it. No registry-url: that only
      # writes an .npmrc `_authToken` line, and an empty one is exactly what made this job fail with ENEEDAUTH.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Stamp the release version into package.json and .claude-plugin/plugin.json
        # `npm version` updates package.json and runs the "version" script, which syncs plugin.json.
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Validate every skill against the Agent Skills spec
        run: |
          set -euo pipefail
          for d in skills/*/; do
            uvx --from skills-ref agentskills validate "$d"
            lines=$(wc -l < "$d/SKILL.md")
            [ "$lines" -le 500 ] || { echo "$d/SKILL.md has $lines lines (> 500)"; exit 1; }
          done

      - name: Validate the Claude Code plugin and the marketplace manifest
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate ../.. --strict

      - name: Skills are discoverable by `npx skills add`
        run: npx -y skills@latest add ./ --list

      - name: Already on npm?
        id: exists
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs.com
        if: ${{ steps.exists.outputs.exists == 'false' }}
        run: |
          echo "Publishing ${VERSION} (dist-tag ${NPM_DIST_TAG}, release=${IS_RELEASE})"
          npm publish --access public --tag "${NPM_DIST_TAG}"
