name: Remote Unit Tests

# Manually/remotely triggerable test run for any branch — lets a machine without a working
# SQL Server (e.g. ARM devices where mssql/server and azure-sql-edge won't run) verify tests on
# a GitHub-hosted x64 runner where Docker + TestContainers work.
#
# Trigger from the CLI:
#   gh workflow run remote-tests.yml --ref <branch>
#   gh workflow run remote-tests.yml --ref <branch> -f project=EfCore/EfCore.Extensions.Tests
#   gh workflow run remote-tests.yml --ref <branch> -f filter="FullyQualifiedName~DynamicAnd"
# Watch / read results:
#   gh run list --workflow remote-tests.yml
#   gh run watch <run-id>
#   gh run view <run-id> --log-failed

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Path (relative to src/) of a test project/.csproj, or the solution. Default: whole solution."
        required: false
        default: "DKNet.FW.sln"
      filter:
        description: "Optional dotnet test --filter expression (e.g. FullyQualifiedName~SomeTest)."
        required: false
        default: ""

concurrency:
  group: remote-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x.x"

      - name: Restore
        run: dotnet restore src/DKNet.FW.sln

      - name: Build
        run: dotnet build src/DKNet.FW.sln --no-restore --configuration Release

      - name: Test
        working-directory: src
        env:
          PROJECT: ${{ inputs.project }}
          FILTER: ${{ inputs.filter }}
        run: |
          args=(--no-build --configuration Release
                --logger "trx;LogFileName=test-results.trx"
                --results-directory ./TestResults
                --verbosity minimal)
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          dotnet test "$PROJECT" "${args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/TestResults/**/*.trx
          if-no-files-found: ignore
